<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f3ec">
<title>SauceyGPT</title><link rel="stylesheet" href="/style.css?v=library-4"><script src="/app.js?v=library-4" defer></script>
</head>
<body>
<main id="thread" aria-label="Conversation"></main>
<div class="composer-wrap">
<div class="library-toolbar"><button type="button" id="open-library">＋ Sources <span id="library-count"></span></button><label class="sr-only" for="library-mode">Where to find answers</label><select id="library-mode"><option value="prefer">Library first, then web</option><option value="only">Library only</option><option value="off">Web only</option></select></div>
<div id="setup" hidden role="status"></div>
<div id="status" role="status" aria-live="polite"></div>
<form id="composer">
<label for="question" class="sr-only">Message</label>
<textarea id="question" rows="1" maxlength="4000" placeholder="Message…" required autofocus></textarea>
<button id="stop" type="button" hidden>Stop</button>
<button id="send" aria-label="Send message" type="submit">↑</button>
</form>
</div>
<dialog id="evidence-dialog" aria-labelledby="evidence-title">
<div class="dialog-heading"><h2 id="evidence-title">Source</h2><button id="close-evidence" type="button" aria-label="Close source excerpt">×</button></div>
<div id="evidence-body"></div>
</dialog>
<dialog id="library-dialog" aria-labelledby="library-title">
<div class="dialog-heading"><h2 id="library-title">Your sauce shelf</h2><button id="close-library" type="button" aria-label="Close library">×</button></div>
<p class="library-intro">Add a document once. Ask it questions anytime.</p>
<p class="excerpt-note">Files stay on this computer. Extracted text is sent to OpenAI for indexing and answers. PDF, Markdown, TXT, or HTML · up to 20 MB.</p>
<label class="field-label" for="document-title">Document name <span>(optional)</span></label><input id="document-title" maxlength="180" placeholder="e.g. Astronomy handbook">
<input type="file" id="document-file" accept=".pdf,.txt,.md,.markdown,.html,.htm" hidden><button id="upload-document" type="button">Upload document</button>
<form id="article-form"><label class="field-label" for="article-url">Or add an article</label><div class="article-row"><input id="article-url" type="url" placeholder="https://…" required><button type="submit" id="import-article">Add</button></div></form>
<p id="library-status" class="excerpt-note" role="status"></p><div id="library-documents"></div>
</dialog>
</body>
</html>
